<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Civitas</title>
<style>
:root{--bg:#f6f1ea;--panel:#fffaf3;--fg:#2b2440;--suave:#6b6080;--borde:#e3d8cb;--acento:#8c2f4b;--acento2:#5b5bd6;
--ok:#2f9e8f;--mal:#c0392b;--aviso:#c58a1b;--ciu:#2f9e8f;--per:#5b5bd6;--inf:#d6457a;--can:#c58a1b;--sombra:0 2px 10px #2b244014}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151020;--panel:#1f1830;--fg:#f1ecfa;--suave:#b3a8c9;
--borde:#3a3150;--acento:#f08aa8;--acento2:#a7a5f2;--ok:#5eead4;--mal:#f4867a;--aviso:#f2c14e;--sombra:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#151020;--panel:#1f1830;--fg:#f1ecfa;--suave:#b3a8c9;--borde:#3a3150;--acento:#f08aa8;
--acento2:#a7a5f2;--ok:#5eead4;--mal:#f4867a;--aviso:#f2c14e;--sombra:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.6rem;margin:.2em 0;color:var(--acento);text-wrap:balance}
h2{font-size:1.15rem;margin:1em 0 .4em}
p{margin:.4em 0}
.panel{background:var(--panel);border:1px solid var(--borde);border-radius:14px;padding:16px;box-shadow:var(--sombra);margin:12px 0}
.suave{color:var(--suave);font-size:.92rem}
label{display:block;font-weight:600;margin:.6em 0 .2em}
input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--borde);background:var(--bg);color:var(--fg)}
input.codigo{text-transform:uppercase;letter-spacing:.3em;font-size:1.3rem;text-align:center}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 16px;min-height:48px;cursor:pointer;
background:var(--acento2);color:#fff;width:100%}
button.sec{background:transparent;color:var(--fg);border:1.5px solid var(--borde)}
button:disabled{opacity:.5;cursor:default}
.fila{display:flex;gap:10px;flex-wrap:wrap}.fila>*{flex:1 1 180px;min-width:0}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.roles{grid-template-columns:1fr}}
.rol{text-align:left;background:var(--bg);color:var(--fg);border:2px solid var(--borde);font-weight:400;padding:12px}
.rol b{display:block;font-size:1.05rem}
.rol[aria-pressed=true]{border-color:currentColor;background:var(--panel)}
.c-ciudadano{color:var(--ciu)}.c-periodista{color:var(--per)}.c-influencer{color:var(--inf)}.c-candidato{color:var(--can)}
.rol span{color:var(--fg);font-size:.9rem}
.error{color:var(--mal);font-weight:600;min-height:1.4em}
.codigo-grande{font-size:2.2rem;letter-spacing:.25em;font-weight:800;text-align:center;color:var(--acento)}
ul.jug{list-style:none;padding:0;margin:0}
ul.jug li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--borde)}
.punto{width:12px;height:12px;border-radius:50%;flex:none}
.etq{font-size:.82rem;padding:2px 8px;border-radius:99px;border:1px solid var(--borde);white-space:nowrap}
.indicadores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:.85rem}
.ind{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px}
.barra{grid-column:1/-1;height:6px;background:var(--borde);border-radius:6px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--ok)}.barra.neg i{background:var(--mal)}
.delta{font-weight:700}.delta.bien{color:var(--ok)}.delta.mal{color:var(--mal)}
.pub{border-left:5px solid var(--acento);padding:10px 14px;background:var(--bg);border-radius:8px}
.pub .autor{font-weight:700;color:var(--suave)}
.pub .texto{font-size:1.25rem;font-weight:700;margin:.2em 0}
.reloj{height:10px;background:var(--borde);border-radius:8px;overflow:hidden;margin:6px 0}
.reloj i{display:block;height:100%;background:var(--acento2);transition:width .9s linear}
.reloj.urgente i{background:var(--mal)}
.opciones{display:grid;gap:10px;margin-top:8px}
.opciones button{background:var(--panel);color:var(--fg);border:1.5px solid var(--borde);text-align:left}
.opciones button:hover,.opciones button:focus-visible{border-color:var(--acento2)}
.tag{font-weight:800;letter-spacing:.04em;font-size:.82rem;text-transform:uppercase;color:var(--mal)}
.res-tipo{font-size:1.4rem;font-weight:800}
.acc{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--borde);font-size:.92rem}
.acc b{white-space:nowrap}.pos{color:var(--ok)}.neg{color:var(--mal)}
svg{width:100%;height:auto;display:block}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--suave)}
.leyenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:var(--c)}
.votos .v{display:grid;grid-template-columns:8.5em 1fr 3em;gap:8px;align-items:center;margin:6px 0;font-size:.95rem}
.votos .v div{height:16px;background:var(--borde);border-radius:6px;overflow:hidden}.votos .v div i{display:block;height:100%;background:var(--acento2)}
.votos .v.gana div i{background:var(--acento)}
.aviso{background:var(--bg);border:1px dashed var(--borde);border-radius:10px;padding:10px;font-size:.92rem}
.oculto{display:none!important}
#capaDuelo{position:fixed;inset:0;z-index:50;background:#08050f;color:#fbf6ee}
#lienzo{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.duelInfo{position:absolute;left:50%;top:18%;transform:translateX(-50%);width:min(92vw,520px);pointer-events:none}
.duelCard{pointer-events:auto;background:#1f1830ee;border:1px solid #3a3150;border-radius:16px;padding:18px;text-align:center}
.duelCard h2{margin:.2em 0;color:#facc15;letter-spacing:.05em}.duelCard .suave{color:#c9b8d8}.duelCard.mini{padding:10px}
.duelCard .grande{font-size:2.4rem;font-weight:900;color:#5eead4;margin:.1em 0}.duelCard .tag{color:#f4b6c2}
.ganador h2.gana{font-size:1.6rem;color:var(--acento);animation:gana .9s ease-out}
@keyframes gana{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.ganador h2.gana{animation:none}}
.fduelo{display:grid;grid-template-columns:minmax(0,9em) 1fr 3em;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--borde)}
.fduelo .suave{grid-column:1/-1;font-size:.82rem}.fduelo.top b:first-child::after{content:" \2605";color:var(--aviso)}
ol.torneo li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:4px 0}ol.torneo li>b:last-child{margin-left:auto}
</style>
</head>
<body>
<main>
  <h1>Arena Civitas</h1>
  <p class="suave">Multijugador de Ciudad Nova para 2–4 jugadores, cada uno en su teléfono o computador.</p>
  <div id="vistas"></div>
  <p class="error" id="error" role="alert"></p>
</main>
<script src="/static/ritmo_motor.js"></script>
<script>
"use strict";
const API = "/api/arena";
const ROLES = [
  ["ciudadano","Ciudadano","Alerta vecinal: cuando reporta, protege a toda su zona."],
  ["periodista","Periodista","Al verificar ve la fuente real; su desmentido protege a quienes la siguen."],
  ["influencer","Influencer","Lo que comparte llega el doble de lejos: aciertos y errores pesan x2."],
  ["candidato","Candidato a alcalde","Si un rumor es sobre su campaña, responde con datos; no puede reportar críticas propias."]];
const COLOR = {ciudadano:"var(--ciu)",periodista:"var(--per)",influencer:"var(--inf)",candidato:"var(--can)"};
const IND = {info_verificada:"Información verificada",confianza:"Confianza",convivencia:"Convivencia",bienestar:"Bienestar digital",
  participacion:"Participación",desinformacion:"Desinformación",conflictos:"Conflictos",rumores:"Rumores"};
const NEG = ["desinformacion","conflictos","rumores"];
const ZONAS = {colegio:[500,80],barrio:[500,250],parque:[250,420],plaza:[750,420],alcaldia:[750,600]};
const CALLES = [["colegio","barrio"],["barrio","parque"],["barrio","plaza"],["plaza","alcaldia"]];
const ACCION = {compartir:"compartió sin verificar",compartir_verificada:"verificó y compartió con la fuente",ignorar:"la ignoró",
  reportar:"la reportó",reportar_falsa:"la verificó y la reportó como falsa",responder:"respondió con datos",sin_respuesta:"no alcanzó a decidir"};

let S = {codigo:null, token:null, rol:"ciudadano", ruta:[], estado:null, grafo:null, version:-1, ronda:null, timer:null, fallos:0};
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function guardar(){ try{ localStorage.setItem("arena_"+S.codigo, S.token); localStorage.setItem("arena_ultima", S.codigo);}catch(e){} }
function leer(c){ try{ return localStorage.getItem("arena_"+c); }catch(e){ return null; } }
function error(m){ $("#error").textContent = m || ""; }

async function llamar(metodo, ruta, cuerpo){
  const r = await fetch(API + ruta, {method:metodo, headers: cuerpo ? {"Content-Type":"application/json"} : {},
    body: cuerpo ? JSON.stringify(cuerpo) : undefined});
  let d = {}; try { d = await r.json(); } catch(e) {}
  if (!r.ok) { const e = new Error(d.detail || "Error de conexión ("+r.status+")"); e.status = r.status; e.codigo = d.error; throw e; }
  return d;
}
async function orden(nombre, datos){
  try { await llamar("POST", `/salas/${S.codigo}/${nombre}`, Object.assign({token:S.token}, datos||{})); error(""); await refrescar(); }
  catch(e){ error(e.message); }
}

/* ---------- inicio ---------- */
function pintarInicio(){
  const url = new URL(location.href); const sala = (url.searchParams.get("sala")||"").toUpperCase();
  $("#vistas").innerHTML = `
  <section class="panel">
    <label for="nombre">Tu nombre</label><input id="nombre" maxlength="20" autocomplete="nickname" placeholder="Ej. Ana">
    <h2>Elige tu rol</h2><p class="suave">Cada rol solo puede elegirlo una persona por sala.</p>
    <div class="roles">${ROLES.map(([id,n,d]) => `<button class="rol c-${id}" data-rol="${id}" aria-pressed="${id===S.rol}"><b>${n}</b><span>${d}</span></button>`).join("")}</div>
  </section>
  <section class="panel">
    <h2>Unirse a una sala</h2>
    <label for="codigo">Código de la sala</label><input id="codigo" class="codigo" maxlength="5" value="${esc(sala)}" placeholder="ABCDE" autocapitalize="characters">
    <div class="fila" style="margin-top:10px"><button id="btnUnir">Unirse</button></div>
  </section>
  <section class="panel">
    <h2>…o crear una nueva</h2>
    <p class="suave">Te damos un código para compartir. Si estás solo, podrás completar la sala con jugadores automáticos.</p>
    <label class="suave" style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="conDuelo" checked style="width:auto">
      <span>Gran final: <b>Duelo de Frecuencias</b> (juego de ritmo, con sonido)</span></label>
    <label for="cancion" class="suave" style="font-weight:400">Canción del duelo</label>
    <select id="cancion" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--borde);background:var(--bg);color:var(--fg);margin-bottom:10px">
      <option value="feria">Feria (36 s, 43 notas)</option><option value="historia">Historia (72 s, 98 notas)</option></select>
    <button id="btnCrear" class="sec">Crear sala</button>
  </section>`;
  document.querySelectorAll(".rol").forEach(b => b.onclick = () => { S.rol = b.dataset.rol;
    document.querySelectorAll(".rol").forEach(x => x.setAttribute("aria-pressed", x.dataset.rol===S.rol)); });
  $("#btnCrear").onclick = () => entrar(null);
  $("#btnUnir").onclick = () => entrar($("#codigo").value.trim().toUpperCase());
}
async function entrar(codigo){
  const nombre = $("#nombre").value.trim();
  if (codigo !== null && !/^[A-Z0-9]{5}$/.test(codigo)) return error("El código tiene 5 letras o números.");
  try {
    const d = codigo ? await llamar("POST", `/salas/${codigo}/unir`, {nombre, rol:S.rol}) : await llamar("POST", "/salas", {nombre, rol:S.rol, duelo: $("#conDuelo").checked, modo_duelo: $("#cancion").value});
    S.codigo = d.codigo; S.token = d.token; guardar(); error("");
    history.replaceState(null, "", "?sala=" + S.codigo);
    iniciarSondeo();
  } catch(e){
    error(e.codigo === "rol" ? "Ese rol ya está ocupado en la sala: elige otro." :
          e.codigo === "llena" ? "La sala está llena (4 jugadores)." :
          e.codigo === "empezada" ? "Esa partida ya empezó." :
          e.codigo === "sala_no_existe" ? "No existe ninguna sala con ese código (o ya terminó)." : e.message);
  }
}

/* ---------- sondeo (el servidor manda; aqui solo se dibuja) ---------- */
function iniciarSondeo(){ clearInterval(S.timer); refrescar(); S.timer = setInterval(refrescar, 1000); }
async function refrescar(){
  if (!S.codigo) return;
  try {
    const t0 = performance.now();
    const d = await llamar("GET", `/salas/${S.codigo}?token=${encodeURIComponent(S.token)}&grafo=${S.grafo ? 0 : 1}`);
    if (d.duelo) { D.sync.agregar(t0, performance.now(), d.duelo.inicio_en_ms); prepararDuelo(d.duelo.modo).catch(() => {}); if (D.motor) programarInicio(); }
    else if (d.duelo_modo && d.ronda >= d.total_rondas - 2) prepararDuelo(d.duelo_modo).catch(() => {});   // precarga
    if (d.grafo) S.grafo = d.grafo;
    S.fallos = 0;
    const cambio = d.version !== S.version || d.fase !== (S.estado && S.estado.fase);
    S.estado = d;
    if (d.fase === "ronda" && S.ronda !== d.ronda) { S.ronda = d.ronda; S.ruta = []; }
    if (d.fase === "duelo") { S.version = d.version; pintarDuelo(d); }
    else if (cambio) { S.version = d.version; pintar(); } else { pintarReloj(); }
  } catch(e){
    if (e.status === 403 || e.status === 404) { clearInterval(S.timer); try{ localStorage.removeItem("arena_"+S.codigo);}catch(x){}
      S.codigo = null; pintarInicio(); return error(e.status === 404 ? "La sala ya no existe." : "Ya no perteneces a esa sala."); }
    if (++S.fallos >= 3) error("Sin conexión con el servidor. Reintentando…");
  }
}

function pintar(){
  const d = S.estado; if (!d) return;
  if (d.fase === "duelo") return pintarDuelo(d);
  if (D.ctx || $("#capaDuelo")) { cerrarCapaDuelo(); detenerAudioDuelo(); }
  if (d.fase === "lobby") return pintarSala(d);
  if (d.fase === "final") return pintarFinal(d);
  if (d.fase === "duelo_resultado") return pintarResumenDuelo(d);
  $("#vistas").innerHTML = cabecera(d) + (d.fase === "ronda" ? ronda(d) : resultado(d)) + marcador(d);
  enlazar();
}
function cabecera(d){
  const delta = (d.fase === "resultado" && d.resultado) ? d.resultado.delta_indicadores : {};
  return `<section class="panel"><div class="fila" style="align-items:center"><b>Sala ${esc(d.codigo)} · ${d.fase === "duelo_resultado" ? "Gran final" : "Ronda " + d.ronda + " de " + d.total_rondas}</b></div>
  <div class="indicadores">${Object.keys(IND).map(k => { const v = d.indicadores[k], x = delta[k] || 0, neg = NEG.includes(k);
    return `<div class="ind"><span>${IND[k]}</span><span>${v}${x ? ` <span class="delta ${(x>0)!==neg?"bien":"mal"}">${x>0?"+":""}${x}</span>` : ""}</span>
    <div class="barra ${neg?"neg":""}"><i style="width:${v}%"></i></div></div>`; }).join("")}</div></section>`;
}
function marcador(d){
  return `<section class="panel"><h2>Jugadores</h2><ul class="jug">${d.jugadores.map(j => `<li>
    <span class="punto" style="background:${j.conectado?COLOR[j.rol]:"var(--borde)"}"></span>
    <span style="flex:1;min-width:0"><b>${esc(j.nombre)}</b> <span class="suave">${j.rol_nombre}</span></span>
    <span class="etq">${j.puntos} pts · rep ${j.reputacion}</span>${d.decidieron.includes(j.id)?'<span class="etq">decidió</span>':""}</li>`).join("")}</ul></section>`;
}

/* ---------- sala ---------- */
function pintarSala(d){
  const soyAnf = d.yo === d.anfitrion, n = d.jugadores.length;
  const faltan = d.jugadores.filter(j => j.id !== d.anfitrion && !d.listos.includes(j.id)).map(j => j.nombre);
  const yoListo = d.listos.includes(d.yo);
  const enlace = location.origin + location.pathname + "?sala=" + d.codigo;
  let estado = n < 2 ? "Falta al menos 1 jugador para empezar." : faltan.length ? "Esperando a: " + faltan.join(", ") : (soyAnf ? "Todo listo: pulsa Empezar." : "Esperando a que el anfitrión empiece.");
  $("#vistas").innerHTML = `<section class="panel"><p class="suave">Código de la sala</p><div class="codigo-grande">${esc(d.codigo)}</div>
    <div class="fila"><button class="sec" id="copiar">Copiar enlace de invitación</button></div>
    <p class="suave" id="enlace" style="word-break:break-all">${esc(enlace)}</p></section>
  <section class="panel"><h2>Sala (${n}/4)</h2><ul class="jug">${d.jugadores.map(j => `<li><span class="punto" style="background:${COLOR[j.rol]}"></span>
    <span style="flex:1;min-width:0"><b>${esc(j.nombre)}</b> <span class="suave">${j.rol_nombre}</span></span>
    <span class="etq">${j.id===d.anfitrion?"Anfitrión":(d.listos.includes(j.id)?"Listo":"Esperando")}</span></li>`).join("")}</ul>
    <p class="aviso" style="margin-top:12px"><b>${esc(estado)}</b></p>
    <div class="fila" style="margin-top:12px">
      ${soyAnf ? `<button id="empezar" ${n<2||faltan.length?"disabled":""}>Empezar</button>${n<4?'<button class="sec" id="bots">Completar con jugadores automáticos</button>':""}`
               : `<button id="listo">${yoListo?"Listo ✓ (pulsa para cancelar)":"Estoy listo"}</button>`}
    </div></section>`;
  $("#copiar").onclick = async () => { try { await navigator.clipboard.writeText(enlace); $("#copiar").textContent = "Enlace copiado"; }
    catch(e){ const r = document.createRange(); r.selectNodeContents($("#enlace")); getSelection().removeAllRanges(); getSelection().addRange(r); } };
  if (soyAnf){ $("#empezar").onclick = () => orden("empezar"); if ($("#bots")) $("#bots").onclick = () => orden("bots"); }
  else $("#listo").onclick = () => orden("listo", {listo: !yoListo});
}

/* ---------- ronda: arbol de decisiones ---------- */
function nodoActual(){ let n = S.estado.arbol; for (const i of S.ruta) n = n && n.hijos[i]; return n; }
function ronda(d){
  const r = d.ronda_info, p = r.publicacion, n = nodoActual();
  const ops = d.ya_decidiste || !n ? `<p class="aviso">Decisión enviada. Esperando al resto de la sala…</p>` :
    `<p><b>${esc(n.texto)}</b></p><div class="opciones">${n.hijos.map((h,i) => `<button data-op="${i}">${esc(h.hijos.length ? h.etiqueta[0].toUpperCase()+h.etiqueta.slice(1) : h.texto)}</button>`).join("")}</div>
     ${S.ruta.length ? '<button class="sec" id="volver" style="margin-top:10px">« Volver a las opciones</button>' : ""}`;
  const yo = d.jugadores.find(j => j.id === d.yo);
  return `<section class="panel"><p class="tag">${esc(r.evento)}</p>
    <div class="pub"><div class="autor">${esc(p.autor)}</div><div class="texto">${esc(p.texto)}</div>
    <div class="suave">Zona: ${esc(p.zona_nombre)}${p.candidato?" · Sobre: "+esc(p.candidato):""}</div></div>
    <p id="txtReloj" style="margin:.6em 0 0"></p><div class="reloj" id="reloj"><i></i></div>
    ${ops}
    ${yo ? `<p class="suave">Tu rol: <b class="c-${yo.rol}">${yo.rol_nombre}</b>. ${ROLES.find(x=>x[0]===yo.rol)[2]}</p>` : ""}
    ${d.yo===d.anfitrion ? `<button class="sec" id="pausa">${d.pausado?"Reanudar":"Pausar ronda"}</button>` : ""}</section>`;
}
function pintarReloj(){
  const d = S.estado; if (!d || d.fase !== "ronda" || !$("#reloj")) return;
  const total = d.ronda_info.segundos, r = d.restante ?? 0;
  $("#txtReloj").innerHTML = d.pausado ? "<b>En pausa</b>" : `<b>Tiempo restante: ${Math.ceil(r)} s</b>`;
  $("#reloj i").style.width = Math.max(0, Math.min(100, r/total*100)) + "%";
  $("#reloj").classList.toggle("urgente", r <= 5);
}
function enlazar(){
  document.querySelectorAll("[data-op]").forEach(b => b.onclick = async () => {
    const i = +b.dataset.op, h = nodoActual().hijos[i];
    if (h.hijos.length) { S.ruta.push(i); return pintar(); }
    document.querySelectorAll("[data-op]").forEach(x => x.disabled = true);
    await orden("accion", {ronda: S.estado.ronda, ruta: S.ruta.concat(i), id: S.codigo + "-" + S.estado.ronda + "-" + Date.now()});
  });
  if ($("#volver")) $("#volver").onclick = () => { S.ruta.pop(); pintar(); };
  if ($("#pausa")) $("#pausa").onclick = () => orden("pausa", {pausar: !S.estado.pausado});
  if ($("#seguir")) $("#seguir").onclick = () => orden("continuar");
  pintarReloj();
}

/* ---------- resultado: propagacion por el grafo ---------- */
function resultado(d){

  const tipo = {falsa:["ERA FALSA","var(--mal)"],verdadera:["ERA VERDADERA","var(--ok)"],opinion:["ERA UNA OPINIÓN","var(--aviso)"]}[p.tipo];

    ${r.desmentida?'<br><b class="pos">Rumor desmentido a tiempo.</b>':""}${r.retirada?'<br><b class="pos">Civitas retiró la publicación.</b>':""}</p>

    ${mio ? `<p class="aviso" style="margin-top:12px"><b>${esc(mio.nota)}</b>${mio.logros_nuevos.map(l => `<br>¡Logro: ${esc(l)}!`).join("")}</p>` : ""}
    ${d.yo===d.anfitrion ? '<button id="seguir" style="margin-top:12px">Siguiente ronda ›</button>' : '<p class="suave">La siguiente ronda empieza en unos segundos.</p>'}</section>`;
}
function grafo(r, p){
  if (!S.grafo) return "";
  const pos = {}, porZona = {};
  S.grafo.nodos.filter(n => n.tipo === "ciudadano").forEach(n => (porZona[n.zona] = porZona[n.zona] || []).push(n));
  for (const [z, ns] of Object.entries(porZona)) ns.forEach((n, k) => { const a = 2*Math.PI*k/ns.length - Math.PI/2;
    pos[n.id] = [ZONAS[z][0] + 95*Math.cos(a), ZONAS[z][1] + 62*Math.sin(a)]; });
  const color = n => r.niveles[0] && r.niveles[0].includes(n) ? "#9333ea" : r.protegidos.includes(n) ? "#0284c7" :
    r.alcanzados.includes(n) ? ({falsa:"#dc2626",verdadera:"#16a34a",opinion:"#f97316"}[p.tipo]) : "#64748b";
  let s = `<svg viewBox="80 20 840 650" role="img" aria-label="Propagación de la publicación entre los ciudadanos de Ciudad Nova"><defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#16a34a"/></marker></defs>`;
  CALLES.forEach(([a,b]) => s += `<line x1="${ZONAS[a][0]}" y1="${ZONAS[a][1]}" x2="${ZONAS[b][0]}" y2="${ZONAS[b][1]}" stroke="currentColor" stroke-opacity=".15" stroke-width="22" stroke-linecap="round"/>`);
  for (const [z,[x,y]] of Object.entries(ZONAS)) s += `<text x="${x}" y="${y+5}" text-anchor="middle" font-size="22" font-weight="800" fill="currentColor" fill-opacity="${z===p.zona?1:.35}">${z==="alcaldia"?"ALCALDÍA":z.toUpperCase()}</text>`;
  for (const [h, pa] of Object.entries(r.padres)) if (pos[h] && pos[pa]) {
    const [x1,y1] = pos[pa], [x2,y2] = pos[h], dx = x2-x1, dy = y2-y1, l = Math.hypot(dx,dy) || 1;
    s += `<line x1="${x1+dx/l*16}" y1="${y1+dy/l*16}" x2="${x2-dx/l*18}" y2="${y2-dy/l*18}" stroke="#16a34a" stroke-width="3" marker-end="url(#fl)"/>`; }
  S.grafo.nodos.filter(n => pos[n.id]).forEach(n => { const [x,y] = pos[n.id];
    s += `<circle cx="${x}" cy="${y}" r="15" fill="${color(n.id)}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y+33}" text-anchor="middle" font-size="16" fill="currentColor">${esc(n.nombre)}</text>`; });
  return s + "</svg>";
}

/* ---------- Duelo de Frecuencias (gran final): motor ritmico real en el navegador ---------- */
/* El servidor fija el inicio; cada telefono reproduce la cancion con Web Audio y juzga con el reloj de AUDIO.
   Las reglas (chart, ventanas, valores) llegan de /api/arena/ritmo/<modo>; el motor es ritmo_motor.js. */
const RECORRIDO_MS = 1500;                   // mismo recorrido de las notas que en Ren'Py (RITMO_RECORRIDO_MS)
const TXT_JUICIO = {perfect:"PERFECT", good:"GREAT", bad:"GOOD", miss:"MISS"};
const COL_JUICIO = {perfect:"#facc15", good:"#5eead4", bad:"#f4b6c2", miss:"#8b84a8"};
const COL_CARRIL = ["#c084fc","#38bdf8","#4ade80","#fb7185"];
const TECLAS = {KeyD:0, ArrowLeft:0, KeyF:1, ArrowDown:1, KeyJ:2, ArrowUp:2, KeyK:3, ArrowRight:3};
const D = {cfg:null, ctx:null, buffer:null, fuente:null, inicioCtx:null, motor:null, sync:new RitmoCivitas.SyncReloj(),
  activo:false, entrado:false, enviado:false, enviando:false, id:null, imgs:{}, pulsos:[0,0,0,0], efectos:[], juicio:null,
  calib:0, raf:null, ultimoProg:0, finLocal:null, auto:false, modo:null, cargando:null};
try { D.calib = +(localStorage.getItem("ritmo_calib") || 0) || 0; } catch(e) {}
D.auto = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URL(location.href).searchParams.get("autoplay") === "1";
D.autoSigma = +(new URL(location.href).searchParams.get("sigma") || 0);     // pruebas: error humano (ms) y notas olvidadas
D.autoFallo = +(new URL(location.href).searchParams.get("fallo") || 0);

function cargarImg(src){ return new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; }); }
async function prepararDuelo(modo){
  if (D.cargando && D.modo === modo) return D.cargando;
  D.modo = modo;
  D.cargando = (async () => {
    D.cfg = await llamar("GET", "/ritmo/" + modo);
    const nombres = [0,1,2,3].flatMap(k => ["nota_"+k, "receptor_"+k, "receptor_on_"+k]).concat(["nova_seria","nova_feliz","nova_enojada"]);
    await Promise.all(nombres.map(async n => { D.imgs[n] = await cargarImg("/static/ritmo/" + n + (n.startsWith("nova") ? ".webp" : ".png")); }));
  })();
  return D.cargando;
}
/* Safari (iPhone) no decodifica OGG: se prueba AAC y, si falla, OGG. */
async function cargarAudio(){
  for (const url of D.cfg.audio) {
    try { const r = await fetch(url); if (!r.ok) continue; return await D.ctx.decodeAudioData(await r.arrayBuffer()); }
    catch(e) {}
  }
  throw new Error("Este navegador no pudo reproducir la canción.");
}
async function entrarDuelo(){
  if (D.entrado) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  D.ctx = new AC({latencyHint:"interactive"});
  try { await D.ctx.resume(); } catch(e) {}
  D.entrado = true; pintarDuelo(S.estado);
  try {
    await prepararDuelo(S.estado.duelo_modo);
    D.buffer = await cargarAudio();
    D.motor = new RitmoCivitas.MotorDuelo(D.cfg.chart, D.cfg.ventanas, D.cfg.valores, D.cfg.combo_rompe);
    D.id = S.codigo + "-duelo-" + S.token.slice(0, 8);
    programarInicio();
  } catch(e) { D.entrado = false; error(e.message); }
  pintarDuelo(S.estado);
}
/* Convierte el inicio estimado (reloj performance.now) al reloj del audio y arranca la cancion.
   Si se entra tarde (recarga, conexion lenta) la cancion empieza en su posicion actual: lo pasado es Miss. */
function programarInicio(){
  if (D.fuente || !D.buffer || D.sync.inicioLocal === null) return;
  const faltan = (D.sync.inicioLocal - performance.now()) / 1000;
  if (faltan > 2.5) return setTimeout(programarInicio, (faltan - 2.4) * 1000);   // se reprograma con la mejor estimacion
  D.inicioCtx = D.ctx.currentTime + faltan;
  D.fuente = D.ctx.createBufferSource(); D.fuente.buffer = D.buffer; D.fuente.connect(D.ctx.destination);
  if (faltan >= 0) D.fuente.start(D.inicioCtx);
  else if (-faltan < D.buffer.duration) D.fuente.start(0, -faltan);
  D.motor.empezar();
  D.finLocal = D.sync.inicioLocal + D.cfg.chart.duration_ms + 800;
  D.activo = true;
  if (!D.raf) D.raf = requestAnimationFrame(cuadro);
}
/* Tiempo de cancion: reloj de audio menos la latencia de salida del dispositivo y la calibracion del jugador. */
function tiempoCancion(){
  if (!D.ctx || D.inicioCtx === null) return -1e9;
  const lat = (D.ctx.outputLatency || D.ctx.baseLatency || 0) * 1000;
  return (D.ctx.currentTime - D.inicioCtx) * 1000 - lat - D.calib;
}
function pulsar(carril){
  if (!D.activo || !D.motor) return;
  const t = tiempoCancion();
  D.motor.actualizar(t);
  D.pulsos[carril] = performance.now();
  const j = D.motor.pulsar(carril, t);
  if (j) { D.juicio = {j, t0: performance.now()}; D.efectos.push({carril, j, t0: performance.now()}); }
}
function cuadro(){
  D.raf = null;
  const cv = document.getElementById("lienzo");
  if (!cv || !D.motor) return;
  const t = tiempoCancion();
  if (D.activo) {
    D.motor.actualizar(t);
    if (D.auto) autojugar(t);
    if (D.motor.estado === "results" || performance.now() > D.finLocal) terminarDuelo();
    if (performance.now() - D.ultimoProg > 1500) { D.ultimoProg = performance.now(); enviarProgreso(); }
  }
  dibujar(cv, t);
  if (D.activo || D.efectos.length) D.raf = requestAnimationFrame(cuadro);
}
function autojugar(t){   /* solo en localhost (?autoplay=1): pruebas automaticas por el mismo camino que un dedo */
  for (const n of D.motor.notas) {
    if (n.estado !== null || n.auto) continue;
    if (n.objetivo === undefined) {
      const g = Math.sqrt(-2 * Math.log(Math.random() || 1e-9)) * Math.cos(2 * Math.PI * Math.random());
      n.objetivo = Math.random() < D.autoFallo ? null : n.time_ms + n.lane * 7 - 12 + g * D.autoSigma;
    }
    if (n.objetivo !== null && t >= n.objetivo) { n.auto = true; pulsar(n.lane); }
  }
}
async function enviarProgreso(){
  const m = D.motor;
  try { await llamar("POST", `/salas/${S.codigo}/progreso`, {token:S.token, juzgadas:m.juzgadas(), puntos:m.puntos(), combo:m.combo, precision:m.senal()}); } catch(e) {}
}
async function terminarDuelo(){
  if (D.enviado || D.enviando) return;
  D.activo = false;
  if (D.motor.estado !== "results") D.motor.cerrar(tiempoCancion());
  D.enviando = true;
  const cuerpo = Object.assign({token:S.token, id:D.id, calibracion_ms:D.calib, latencia_ms:D.sync.rtt}, D.motor.resultado());
  for (let intento = 0; intento < 15 && !D.enviado; intento++) {
    try { const r = await llamar("POST", `/salas/${S.codigo}/duelo`, cuerpo); D.enviado = true; D.miResultado = r.resultado; }
    catch(e) {
      if (e.status && e.status < 500 && e.codigo !== "rate_limited") { D.enviado = true; error("El servidor rechazó el resultado: " + e.message); }
      else await new Promise(ok => setTimeout(ok, 2000));    // misma id: si llego dos veces, cuenta una
    }
  }
  D.enviando = false;
  pintarDuelo(S.estado);
}
function detenerAudioDuelo(){
  try { if (D.fuente) D.fuente.stop(); } catch(e) {}
  try { if (D.ctx) D.ctx.close(); } catch(e) {}
  Object.assign(D, {ctx:null, buffer:null, fuente:null, inicioCtx:null, motor:null, activo:false, entrado:false, enviado:false,
    enviando:false, efectos:[], juicio:null, missVistos:0, sync:new RitmoCivitas.SyncReloj()});
}
function expresionNova(){
  const m = D.motor; if (!m) return "nova_seria";
  if (m.combo >= 10) return "nova_enojada";
  if (m.ultimos.length && m.ultimos[m.ultimos.length - 1][2] === "miss") return "nova_feliz";
  return "nova_seria";
}

/* Dibujo: el tiempo de cancion decide donde va cada nota; los frames solo pintan (igual que en Ren'Py). */
function dibujar(cv, t){
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)) { cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  const m = D.motor, chart = D.cfg.chart, ahora = performance.now();
  const beat = 60000 / chart.bpm, fase = t > 0 ? ((t - chart.offset_ms) % beat) / beat : 0;
  const pulso = t > 0 && t < chart.duration_ms ? Math.pow(1 - fase, 3) : 0;
  // Fondo: degradado que late con la musica.
  const fondo = g.createLinearGradient(0, 0, 0, H);
  fondo.addColorStop(0, `rgb(${18+pulso*30},${12+pulso*8},${30+pulso*40})`); fondo.addColorStop(1, "#08050f");
  g.fillStyle = fondo; g.fillRect(0, 0, W, H);
  const ancho = Math.min(W * 0.92, 520), carril = ancho / 4, x0 = (W - ancho) / 2;
  const recY = H - Math.max(96, H * 0.16), naceY = Math.max(110, H * 0.17), tam = Math.min(carril * 0.86, 96);
  // NOVA (rival): a la izquierda en pantallas anchas, arriba a la derecha en el telefono.
  const nova = D.imgs[expresionNova()];
  if (nova) {
    const h = W > 900 ? H * 0.62 : H * 0.2, w = h * nova.width / nova.height, rebote = Math.sin(t / beat * Math.PI) * 6;
    g.globalAlpha = W > 900 ? 0.95 : 0.5;
    g.drawImage(nova, W > 900 ? x0 - w - 30 : W - w - 4, (W > 900 ? H - h : naceY - 20) + rebote, w, h);
    g.globalAlpha = 1;
  }
  for (let k = 0; k < 4; k++) {
    g.fillStyle = k % 2 ? "rgba(27,20,38,.55)" : "rgba(27,20,38,.7)";
    g.fillRect(x0 + k*carril + 3, 0, carril - 6, H);
    const brillo = Math.max(0, 1 - (ahora - D.pulsos[k]) / 160);
    if (brillo > 0) { g.fillStyle = COL_CARRIL[k] + Math.round(brillo * 60).toString(16).padStart(2, "0"); g.fillRect(x0 + k*carril + 3, 0, carril - 6, H); }
    const rec = D.imgs[(brillo > 0.3 ? "receptor_on_" : "receptor_") + k], cx = x0 + k*carril + carril/2, s = tam * (1 + pulso * 0.06);
    if (rec) g.drawImage(rec, cx - s/2, recY - s/2, s, s);
  }
  // Notas
  for (let i = m.siguiente; i < m.notas.length; i++) {
    const n = m.notas[i]; if (n.estado !== null) continue;
    const dt = n.time_ms - t; if (dt > RECORRIDO_MS) break;
    const y = recY - dt / RECORRIDO_MS * (recY - naceY), img = D.imgs["nota_" + n.lane];
    g.globalAlpha = Math.max(0, Math.min(1, (y - naceY + 80) / 120));
    if (img) g.drawImage(img, x0 + n.lane*carril + carril/2 - tam/2, y - tam/2, tam, tam);
    g.globalAlpha = 1;
  }
  // Efectos al acertar: onda del color del juicio sobre el receptor.
  D.efectos = D.efectos.filter(e => ahora - e.t0 < 380);
  for (const e of D.efectos) {
    const p = (ahora - e.t0) / 380, cx = x0 + e.carril*carril + carril/2;
    g.strokeStyle = COL_JUICIO[e.j]; g.globalAlpha = 1 - p; g.lineWidth = 6 * (1 - p) + 1;
    g.beginPath(); g.arc(cx, recY, tam * (0.45 + p * 0.6), 0, 2 * Math.PI); g.stroke(); g.globalAlpha = 1;
  }
  // Juicio, combo, puntos y barra de precision.
  g.textAlign = "center"; g.lineJoin = "round";
  if (m.conteo.miss > (D.missVistos || 0)) { D.missVistos = m.conteo.miss; D.juicio = {j:"miss", t0: ahora}; }
  if (D.juicio && ahora - D.juicio.t0 < 600) {
    const p = (ahora - D.juicio.t0) / 600, esc = 1.25 - Math.min(0.25, p * 1.5);
    g.font = `900 ${Math.round(34 * esc)}px system-ui,sans-serif`; g.globalAlpha = 1 - p * p;
    g.strokeStyle = "#1b1426"; g.lineWidth = 6; g.strokeText(TXT_JUICIO[D.juicio.j], W/2, recY - tam * 1.6);
    g.fillStyle = COL_JUICIO[D.juicio.j]; g.fillText(TXT_JUICIO[D.juicio.j], W/2, recY - tam * 1.6); g.globalAlpha = 1;
  }
  if (m.combo >= 3) {
    g.font = `900 ${Math.round(26 + Math.min(14, m.combo / 4))}px system-ui,sans-serif`; g.strokeStyle = "#1b1426"; g.lineWidth = 5;
    g.strokeText("x" + m.combo, W/2, recY - tam * 2.25); g.fillStyle = "#fbf6ee"; g.fillText("x" + m.combo, W/2, recY - tam * 2.25);
  }
  g.font = "800 15px system-ui,sans-serif"; g.fillStyle = "#c9b8d8"; g.textAlign = "left";
  g.fillText("DUELO DE FRECUENCIAS", 14, 26);
  g.font = "900 28px system-ui,sans-serif"; g.fillStyle = "#fbf6ee"; g.fillText(String(m.puntos()).padStart(4, "0"), 14, 58);
  const senal = m.senal(), bw = Math.min(260, W - 28);
  g.fillStyle = "#e86a7e"; g.fillRect(14, 70, bw, 10); g.fillStyle = "#5eead4"; g.fillRect(14, 70, bw * senal, 10);
  g.font = "700 12px system-ui,sans-serif"; g.fillStyle = "#c9b8d8";
  g.fillText(`SEÑAL ${Math.round(senal*100)}%  ·  combo máx. x${m.maxCombo}`, 14, 96);
  // Rivales en vivo (marcador que envia cada telefono; los puntos oficiales los calcula el servidor al final).
  const prog = (S.estado && S.estado.duelo && S.estado.duelo.progreso) || {};
  g.textAlign = "right"; let yr = 26;
  for (const j of (S.estado ? S.estado.jugadores : [])) {
    if (j.id === S.estado.yo) continue;
    const p = prog[j.id]; g.font = "700 13px system-ui,sans-serif"; g.fillStyle = "#c9b8d8";
    g.fillText(`${j.nombre}: ${p ? p.puntos + " · x" + p.combo : "…"}`, W - 14, yr); yr += 18;
  }
  // Cuenta atras comun.
  if (t < 0 && t > -4000) {
    g.textAlign = "center"; g.font = "900 72px system-ui,sans-serif"; g.fillStyle = "#facc15";
    g.fillText(String(Math.ceil(-t / 1000)), W/2, H * 0.45);
  }
}

function pintarDuelo(d){
  const cfgListo = !!D.motor, faltan = D.sync.inicioLocal !== null ? Math.ceil((D.sync.inicioLocal - performance.now()) / 1000) : null;
  let capa = $("#capaDuelo");
  if (!capa) {
    $("#vistas").innerHTML = "";
    capa = document.createElement("div"); capa.id = "capaDuelo"; document.body.appendChild(capa);
    capa.innerHTML = `<canvas id="lienzo" aria-label="Duelo de Frecuencias: 4 carriles"></canvas>
      <div id="duelInfo" class="duelInfo"></div>
      <div class="zonas" aria-hidden="true"><i></i><i></i><i></i><i></i></div>`;
    const cv = $("#lienzo");
    cv.addEventListener("pointerdown", ev => { ev.preventDefault(); const r = cv.getBoundingClientRect();
      const ancho = Math.min(r.width * 0.92, 520), x0 = (r.width - ancho) / 2, x = ev.clientX - r.left;
      let k = Math.floor((x - x0) / (ancho / 4)); k = Math.max(0, Math.min(3, k)); pulsar(k); }, {passive:false});
  }
  const info = $("#duelInfo");
  if (D.enviado || D.enviando) {
    const r = D.miResultado;
    info.innerHTML = `<div class="duelCard"><h2>${D.enviando ? "Enviando tu resultado…" : "¡Canción terminada!"}</h2>
      ${r ? `<p class="grande">${r.normalizado} / 1000</p><p>${esc(r.resumen)}</p>
        <p class="suave">PERFECT ${r.detalle.conteo.perfect} · GREAT ${r.detalle.conteo.good} · GOOD ${r.detalle.conteo.bad} · MISS ${r.detalle.conteo.miss}</p>` : ""}
      <p class="suave">Esperando a los demás: ${d.duelo ? d.duelo.entregaron.length : "?"} de ${d.jugadores.length} terminaron.</p></div>`;
  } else if (!D.entrado) {
    info.innerHTML = `<div class="duelCard"><p class="tag">Gran final · Ronda ${d.duelo_ronda} de ${d.total_rondas}</p>
      <h2>DUELO DE FRECUENCIAS</h2><p>NOVA secuestra la transmisión. Misma canción y mismas notas para todos: gana quien tenga más ritmo.</p>
      <p class="suave">Toca los 4 carriles (o D F J K / flechas) cuando cada nota llegue a su receptor. PERFECT · GREAT · GOOD · MISS. El combo se rompe con GOOD o MISS.</p>
      <button id="btnEntrar">${faltan !== null && faltan < 0 ? "¡Ya empezó! Entrar ahora" : "Entrar al duelo (activa el sonido)"}</button>
      <p class="suave">${faltan !== null && faltan > 0 ? "Empieza en " + faltan + " s" : ""}</p></div>`;
    $("#btnEntrar").onclick = entrarDuelo;
  } else if (!cfgListo) {
    info.innerHTML = `<div class="duelCard"><h2>Cargando la canción…</h2></div>`;
  } else if (!D.activo || tiempoCancion() < 0) {
    info.innerHTML = `<div class="duelCard mini"><p>Calibración: <b>${D.calib > 0 ? "+" : ""}${D.calib} ms</b> <span class="suave">(si las notas suenan tarde, sube)</span></p>
      <div class="fila"><button class="sec" id="calMenos">−10 ms</button><button class="sec" id="calMas">+10 ms</button></div></div>`;
    const cal = v => { D.calib = Math.max(-D.cfg.calibracion_max_ms, Math.min(D.cfg.calibracion_max_ms, D.calib + v));
      try { localStorage.setItem("ritmo_calib", D.calib); } catch(e) {} pintarDuelo(S.estado); };
    $("#calMenos").onclick = () => cal(-10); $("#calMas").onclick = () => cal(10);
  } else info.innerHTML = "";
  if (D.motor && !D.raf) D.raf = requestAnimationFrame(cuadro);
}
function cerrarCapaDuelo(){ const c = $("#capaDuelo"); if (c) c.remove(); }

function pintarResumenDuelo(d){
  cerrarCapaDuelo(); detenerAudioDuelo();
  const r = d.duelo_resumen, filas = Object.entries(r.resultados).sort((a, b) => b[1].normalizado - a[1].normalizado);
  const nombre = id => (d.jugadores.find(j => j.id === id) || {nombre:id}).nombre;
  const rol = id => (d.jugadores.find(j => j.id === id) || {}).rol;
  $("#vistas").innerHTML = cabecera(d) + `<section class="panel ganador"><p class="tag">Gran final · Duelo de Frecuencias</p>
    <h2 class="gana">¡${esc(r.ganador_nombre)} gana el duelo!</h2>
    ${filas.map(([id, x], i) => `<div class="fduelo ${id === r.ganador ? "top" : ""}"><b class="c-${rol(id)}">${i+1}. ${esc(nombre(id))}</b>
      <div class="barra"><i style="width:${x.normalizado/10}%"></i></div><b>${x.normalizado}</b>
      <span class="suave">${esc(x.resumen)}${x.detalle && x.detalle.conteo ? ` · P ${x.detalle.conteo.perfect} · Gr ${x.detalle.conteo.good} · Go ${x.detalle.conteo.bad} · M ${x.detalle.conteo.miss}` : ""}</span></div>`).join("")}
    <p>Ciudad Nova (media del grupo ${r.media}/100): ${Object.keys(r.delta_ciudad).length ? Object.entries(r.delta_ciudad).map(([k,v]) => `${IND[k]} ${v>0?"+":""}${v}`).join(", ") : "sin cambios"}.</p>
    <h2>Clasificación acumulada</h2>${tablaTorneo(r.clasificacion)}
    ${d.yo === d.anfitrion ? '<button id="seguir">Última ronda del Consejo ›</button>' : '<p class="suave">La última ronda del Consejo empieza en unos segundos.</p>'}</section>` + marcador(d);
  enlazar();
}
function tablaTorneo(t){
  return `<ol class="torneo">${t.map(f => `<li><b class="c-${f.rol}">${esc(f.nombre)}</b> <span class="suave">Consejo ${f.consejo} + Duelo ${f.duelo}</span> <b>${f.total}</b></li>`).join("")}</ol>`;
}

/* ---------- arranque: reconexion automatica ---------- */
(function(){
  const sala = (new URL(location.href).searchParams.get("sala") || "").toUpperCase();
  const token = sala && leer(sala);
  if (sala && token) { S.codigo = sala; S.token = token; iniciarSondeo(); } else pintarInicio();
})();
</script>
